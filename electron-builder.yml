appId: co.eris.corvath
productName: Corvath
# The 1254px master is BUILD-TIME ONLY, so it lives in buildResources (build/) and is
# never packaged. The runtime derivatives in resources/ are sized to what draws them:
# corvath-icon-256.png (window/taskbar) and corvath-splash.webp (84px splash glyph).
icon: build/icon.png
directories:
  buildResources: build
# ALLOWLIST, not a denylist. electron-builder includes the whole project directory
# by default; the scaffold's negation list only subtracted from it, so every top-level
# directory added since (coverage/, docs/, e2e/, scripts/, test-results/, .claude/, the
# tsconfigs and both .tsbuildinfo) shipped inside app.asar. A denylist leaks the moment
# somebody adds a directory; an allowlist cannot.
#
# The trade is that a new runtime asset must be NAMED here or it silently does not ship.
# That is the mechanism working, not a bug -- it makes a runtime dependency an explicit
# decision instead of an accident. Say why each entry is here.
files:
  - out/** # the built main / preload / renderer bundles
  - resources/** # splash.html + the window/splash icon; also the renderer publicDir
  - node_modules/** # main+preload runtime deps only (see _dependenciesNote in package.json)
  - package.json # electron reads name/version/main at boot
  - CHANGELOG.md # read at runtime by the About card's "What's new" dialog
  - bundled/** # shipped deck art, read at runtime from <appRoot>/bundled/decks/
# `bundled/` is 83 MB of deck art. Keep it OUT of the asar so it is read as ordinary
# files (main resolves it via join(__dirname, '../../bundled/decks')) and so the archive
# stays small enough to be cheap to open. The cost: the art is outside the asar
# integrity check (see enableEmbeddedAsarIntegrityValidation below).
asarUnpack:
  - bundled/**
win:
  executableName: corvath
  # BOTH, and the release workflow names neither. `release.yml` packages with a
  # bare `--win`, so this list is the only statement of what Windows ships.
  # A target list in two places is a target list that disagrees with itself:
  # taliesin declared nsis here since WP14 while its workflow packaged
  # `--win portable`, so it shipped no installer for eight releases and every
  # gate passed (HTOO-369). scripts/release-artifacts.test.mjs pins this list
  # against the release job's globs in both directions.
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
portable:
  artifactName: ${name}-${version}-portable.${ext}
  # NO `splashImage`, on purpose (HTOO-466). With one, the NSIS stub runs in GUI
  # mode: it paints the bitmap, hides its own "Setup" dialog, extracts, runs the
  # app, and — when the app exits — re-shows that hidden dialog for its completion
  # step before `AutoCloseWindow` closes it. That re-show is a blank window that
  # flashes after the app's own window has gone, on every close. There is no hook
  # to stop it: electron-builder reads `portable.nsi` verbatim for this target.
  #
  # Without it the stub runs `SetSilent silent` and owns no window. The cost is a
  # busy cursor, and no image, while the stub extracts the app to %TEMP% on each
  # launch. The in-app splash (`resources/splash.html`) covers everything from
  # electron's first frame on. Do not add the image back to fill that gap: it is
  # the flash's cause. scripts/portable-config.test.mjs pins the absence.
  #
  # Extract to a directory unique to each LAUNCH, not to each BUILD (HTOO-351,
  # fault 2). Left unset, electron-builder bakes one KSUID into the exe at build
  # time, so every copy of a build extracts to the same $TEMP\<ksuid>. A second
  # launch then runs `RMDir /r` on the directory the RUNNING copy executes from
  # and copies over its locked files, which ends in NSIS's own "Corvath cannot
  # be closed" Retry/Cancel box. With a directory per launch, the second copy
  # reaches Electron, loses requestSingleInstanceLock and exits, and the first
  # window comes forward.
  #
  # TRUE, not the documented `false`. app-builder-lib 26.17.0
  # (NsisTarget.js:263) resolves this as
  #   if (typeof unpackDirName === "string" || !unpackDirName)
  #     defines.UNPACK_DIR_NAME = unpackDirName || generateKsuid()
  # so `false` takes the branch and still gets a build-time KSUID. Only a truthy
  # non-string leaves UNPACK_DIR_NAME undefined, and portable.nsi then falls back
  # to $PLUGINSDIR\app, which NSIS makes unique per process. Do not "correct"
  # this to `false`. Creidhne measured it (HTOO-351).
  #
  # The cost: a killed stub's folder has a name no later launch reuses, so
  # src/main/portableSweep.ts removes it (HTOO-494).
  unpackDirName: true
nsis:
  # Predictable name for the release workflow's sign + upload steps. The default
  # is "Corvath Setup <version>.exe", with spaces, which every path in that
  # workflow would then have to quote.
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # Assisted rather than one-click, and per-user rather than per-machine. The
  # three settle together, and match taliesin, creidhne and epona:
  #   * oneClick: false gives a wizard rather than an install that starts on
  #     double-click.
  #   * perMachine: false installs under the user profile, so there is no UAC
  #     prompt and no administrator requirement. It also agrees with where the
  #     app already keeps its data: %LOCALAPPDATA%\Erisco\Corvath.
  #   * allowToChangeInstallationDirectory only has an effect while oneClick is
  #     false; NSIS has no directory page to offer in a one-click install.
  # perMachine is the expensive one to revisit: a per-machine installer does NOT
  # upgrade an existing per-user installation, and the user ends with two. It is
  # safe to settle now only because corvath has never shipped an installer.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# mac/linux are scaffolded ahead of signing. The CI jobs build them on every
# release; the mac job signs and notarizes only when Apple credentials exist, so
# an unsigned build still produces a usable artifact until they do.
mac:
  category: public.app-category.lifestyle
  # Its own art, NOT the Windows master: macOS does not mask app icons, so the
  # icon must already carry Apple's grid — art inset to 824/1024 of the canvas
  # and masked to a continuous-corner squircle. Derived from the document repo's
  # macOS variant; see docs/plans for the recipe.
  icon: build/icon-mac.png
  target:
    - target: dmg
      arch:
        - universal
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Flip to true once APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are
  # set as repository secrets. Left false deliberately: with notarization on and
  # no credentials, the build FAILS rather than degrading to unsigned.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # MUST be explicit, and must be a DIRECTORY.
  #
  # electron-builder resolves the Linux icon as [linux.icon, mac.icon ?? icon]
  # (app-builder-lib LinuxTargetHelper.js), so mac.icon OUTRANKS the top-level
  # icon above. This key was already explicit and the row was STILL a defect --
  # corvath was the one repo in R-008's sweep where that was true, because the
  # invariant is the SET, not the key.
  #
  # A single PNG is never resampled (iconConverter.js): one PNG in, one hicolor
  # entry out, at its own size. hicolor's index.theme stops at 512, so the old
  # `build/icon.png` produced one 1254x1254 entry that no desktop environment
  # indexes -- the generic blank document icon.
  #
  # WHICH ARTWORK. build/icon.png is the WINDOWS art (raven + heptagram). The
  # macOS/Linux art is the document repo's Corvath_fixed.png (line-art card +
  # quill) -- a different picture, not a variant, measured at 19.5% RMSE.
  # build/icon-mac.png is that same master with Apple's squircle and 824/1024
  # inset ADDED, so Linux takes a straight resize and crops nothing. Generating
  # from build/icon.png would ship a plausible, verifiable, WRONG icon.
  #
  # Regenerate with:  node scripts/make-linux-icons.mjs
  icon: build/icons
  # A correct hicolor set is only half of it, and this is the half that gets
  # missed: oghma shipped the right sizes and still drew a generic taskbar icon.
  # Electron derives its app_id / WM_CLASS from package.json's `desktopName`
  # (corvath.desktop -> "corvath"), while electron-builder writes StartupWMClass
  # from productName ("Corvath") when this is unset. That mismatch stops a
  # desktop environment linking the running window to the installed entry,
  # however correct build/icons/ is.
  #
  # Since productName became "Corvath" the two differ ONLY IN CASE, which reads
  # like a harmless cosmetic difference and is not: StartupWMClass matching is
  # case-sensitive, so "Corvath" still fails to match "corvath" and the taskbar
  # icon still falls back to generic. Do not delete this on the grounds that the
  # names now "look the same".
  #
  # `desktopName` itself lives in package.json, NOT here: there is no
  # linux.desktopName key in the schema, and putting it here does not get
  # ignored -- it rejects the ENTIRE linux block with "configuration.linux
  # should be one of these: null", a message that never names the offending key.
  # Mabon shipped that for one commit; `npm run build` is electron-vite and
  # never reads this file, so every gate stayed green on a config that could not
  # package at all.
  syncDesktopName: true
  category: Utility
  synopsis: Tarot reading recorder
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  artifactName: ${name}-${version}.${ext}

npmRebuild: false

# Turn off the escape hatches built into the shipped Electron binary. Native
# electron-builder config, never an afterPack hook: on a mac universal build the
# per-arch packs must stay pristine, and a per-arch hook corrupts the merge with
# an "identical SHAs" failure.
electronFuses:
  runAsNode: false # no ELECTRON_RUN_AS_NODE -> the exe cannot be used as a node shell
  enableNodeCliInspectArguments: false # no --inspect into the main process
  enableNodeOptionsEnvironmentVariable: false # no NODE_OPTIONS injection at launch
  onlyLoadAppFromAsar: true # refuse a side-loaded app/ dir next to the asar
  # Electron checks app.asar against the hash electron-builder embeds in the
  # executable, file by file as it reads (HTOO-381; house decision, Sabrael,
  # 2026-09-28). The build side already ran without it: electron-builder writes the
  # per-file block hashes and the embedded hash whatever the fuse says, so this only
  # makes Electron enforce them. Enforced on Windows and macOS; Linux ignores it.
  #
  # A changed asar is then a DEAD app: exit code 1 and `ASAR Integrity Violation`
  # on stderr only, no window and no message. That is why it lands WITH the reader:
  # scripts/verify-fuses.mjs asserts index 4 in each release build job, and the
  # release process starts the packaged build before tagging (CHANGELOG header).
  #
  # THE DECK ART IS NOT COVERED. `bundled/` (83 MB) is asarUnpack'd above, so the
  # real app.asar is about 7 MB of code, splash and CHANGELOG. The asar header
  # carries hashes for the unpacked files too, but Electron does not check them
  # (epona measured it: a changed unpacked file loads). So the fuse guards the
  # code, not the art. On Windows the hash lives in the inner corvath.exe, and the
  # release job signs only the outer setup and portable exes, so this catches a
  # damaged or changed package, not a local attacker.
  #
  # Cost (HTOO-399, measured in oghma): nothing warm, 10-25 ms on a launch from
  # new files, which is every portable start. Corvath's own before/after launch
  # timing is in the commit that turned this on.
  enableEmbeddedAsarIntegrityValidation: true
  resetAdHocDarwinSignature: true # required once fuses are flipped on mac arm64
