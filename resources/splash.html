<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Corvath</title>
    <!-- HTOO-402. This document has no script of any kind and loads one
         same-origin image, so it can afford a policy far tighter than the
         renderer's: no default source at all, inline CSS for the one <style>
         block below, and same-origin images for the glyph. The main process also
         serves a header policy; the two intersect, so this is what governs. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'"
    />
    <style>
      /* Splash is shown in a frameless, transparent BrowserWindow before the
         renderer bundle loads. Intentionally self-contained (no JS, no build
         step, no external CSS) so it paints instantly. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        -webkit-user-select: none;
        cursor: default;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      .card {
        box-sizing: border-box;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 28px;
        border-radius: 14px;
        /* Deep-navy Hybrasyl palette (matches the app's default theme). */
        background: radial-gradient(circle at 50% 35%, #16294a 0%, #0d182f 70%, #0a1223 100%);
        border: 1px solid rgba(77, 132, 209, 0.35);
        box-shadow:
          0 12px 40px rgba(0, 0, 0, 0.55),
          inset 0 0 0 1px rgba(240, 230, 204, 0.04);
        color: #f0e6cc;
      }
      /* flex-shrink: 0 on the glyph and the spinner (HTOO-553): when the font falls
         back from Segoe UI the column overflows, and flex takes the overflow out of
         the spinner, which then draws as an oval. */
      .glyph {
        flex-shrink: 0;
        width: 84px;
        height: 84px;
        border-radius: 14px;
        filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.6));
      }
      .title {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 6px;
        color: #f0e6cc;
      }
      .subtitle {
        font-size: 12px;
        letter-spacing: 1px;
        color: #a8b8c4;
        margin-top: -6px;
      }
      .spinner {
        flex-shrink: 0;
        width: 22px;
        height: 22px;
        margin-top: 4px;
        border: 2px solid rgba(168, 184, 196, 0.25);
        border-top-color: #3a9e90;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- Loaded from resources/ alongside this file, so it resolves under file:// too. -->
      <!-- 256px WebP, not the 1254px master: this decode is on the splash's FIRST
           PAINT, the one thing this window exists to make fast. Drawn at 84px. -->
      <img class="glyph" src="corvath-splash.webp" alt="" />
      <div class="title">CORVATH</div>
      <div class="subtitle">Tarot</div>
      <div class="spinner"></div>
    </div>
  </body>
</html>
