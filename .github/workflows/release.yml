name: Release

# Builds and publishes a tagged release. The PR gate lives in ci.yml — do NOT
# add a `pull_request` trigger here: this workflow builds and signs three
# platforms and no PR needs that. (It used to carry the gate, which is why the
# validate job below is now only a pre-release sanity check rather than the
# only thing standing between a PR and main.)
#
# Optional repository secrets — every one of them is guarded, so a release
# without them still produces usable, unsigned artifacts:
#   ES_USERNAME / ES_PASSWORD / ES_CREDENTIAL_ID / ES_TOTP_SECRET  (SSL.com eSigner, Windows, through CodeSignTool)
#     — when unset, both exes ship UNSIGNED and SmartScreen warns on first run.
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID          (notarization, macOS)
#   CSC_LINK / CSC_KEY_PASSWORD                                     (Developer ID cert, macOS)
#     — when unset, the dmg is unsigned and Gatekeeper warns. Flip
#       `mac.notarize` to true in electron-builder.yml once these exist.
#   DISCORD_WEBHOOK_URL                                             (release announcement)

# CHECKOUT DEPTH: 1, the `actions/checkout` default, on purpose (HTOO-328).
# A depth-1 clone has no parents for the commit it checks out, so every commit
# reads as a root commit. Nothing in ci.yml or release.yml reads the CLONE's
# history. No file in src/, the unit tests or the e2e specs runs git or parses
# its output, and none of them imports child_process, so the e2e job in ci.yml
# drives an app that reads no git. validate-linux.mjs runs git on the
# developer's machine only, changelog-extract.mjs reads CHANGELOG.md, and the
# release notes come from the GitHub API. So depth 1 gives no wrong answer
# today. Set `fetch-depth: 0` on a job the moment one of its steps reads commit
# parents, `merge-base`, ahead/behind or `git describe` from the checkout.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Every action here runs on Node 24 natively: checkout@v7, setup-node@v7,
# setup-java@v5, upload-artifact@v7, download-artifact@v8 and
# softprops/action-gh-release@v3.
#
# No FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 env. It was here for one holdout,
# `sslcom/esigner-codesign` (it declares `using: node20`). That action is gone:
# the Windows job runs CodeSignTool itself (see "Sign installer + portable
# exe"). Do not add the env again without a holdout that needs it (HTOO-517).

jobs:
  # Fast sanity gate before three platform builds start. ci.yml is the real gate
  # on the way into main; this catches a tag cut from a broken commit.
  validate:
    runs-on: ubuntu-latest

    steps:
      # Depth 1 (the default) is deliberate — see the CHECKOUT DEPTH note at the top.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:check

      - name: Format check
        run: npm run format:check

      - name: Test + coverage gate
        run: npm run test:coverage

  build-windows:
    runs-on: windows-latest
    needs: validate

    steps:
      # Depth 1 (the default) is deliberate — see the CHECKOUT DEPTH note at the top.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      # No target list here, so the Windows targets live in electron-builder.yml
      # and nowhere else. A target list in two places is a target list that
      # disagrees with itself, and the config is the half a reader checks --
      # taliesin named `--win portable` against a config declaring nsis too, and
      # shipped no installer for eight releases with every gate green (HTOO-369).
      # scripts/release-artifacts.test.mjs enforces the absence of a list here.
      - name: Package installer + portable exe
        run: npx electron-builder --win --publish never

      # HTOO-403. The electronFuses block in electron-builder.yml is proof that
      # electron-builder was ASKED, not that it did it -- the wire is burned in
      # during packaging, so an electron-builder major, a target change or an
      # afterPack hook can stop it applying with the YAML untouched and every
      # gate green. Read it back off the artifact.
      #
      # BEFORE signing, deliberately: signing rewrites the executable, and a
      # check that ran after it would be testing a different file than the one
      # whose fuses we care about. Both Windows artifacts wrap this same
      # win-unpacked directory -- the portable exe as a self-extracting stub, the
      # installer by writing it to disk -- so this one read covers both.
      #
      # Index 4 (asar integrity, HTOO-381) is the one that hurts if it goes
      # wrong the other way: with it on, a changed app.asar is an app that exits
      # with no window. The read proves the fuse is set, not that the embedded
      # hash matches; only starting the packaged build before the tag proves that.
      - name: Verify Electron fuses
        run: npm run verify:fuses -- dist/win-unpacked/corvath.exe

      - name: Resolve artifact name + version
        id: pkg
        shell: bash
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The secrets context is not available in a step-level `if:`, so probe it
      # into an output first and gate both signing steps on that.
      - name: Check for signing credentials
        id: signing
        shell: bash
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
        run: |
          if [ -n "$ES_USERNAME" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::No SSL.com eSigner credentials set — shipping UNSIGNED exes.'
          fi

      # WINDOWS SIGNING: CodeSignTool on a CURRENT JDK, never its bundled one
      # (HTOO-517).
      #
      # Every CodeSignTool release (v1.3.2 is the newest) bundles JDK 11.0.2 from
      # 2019, and its CodeSignTool.bat always runs that JDK. On 2026-09-30 SSL.com
      # renewed the certificate of login.ssl.com, the OAuth host CodeSignTool
      # signs in at. The new chain ends at "SSL.com TLS RSA Root CA 2022" with no
      # cross-signed copy, and that old trust store does not have the 2022 root:
      # every sign failed with `PKIX path building failed`. The action
      # `sslcom/esigner-codesign`, which this job used before, runs the bundled
      # JDK. Temurin 17 and 21 have the 2022 root.
      #
      # GUARDED, unlike the template: with no ES_* secrets, corvath warns and
      # ships unsigned rather than failing (the backlog's "Windows code signing"
      # row). Both steps carry the SAME condition, so they run together or not
      # at all. Remove the guard when the secrets exist, so a run without them
      # fails instead of publishing unsigned.
      - name: Set up Java 17 for CodeSignTool
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ONE step signs BOTH artifacts, so they cannot get apart. Signing one of
      # the two would be worse than signing neither: a user handed a signed
      # installer beside an unsigned portable exe cannot read that as
      # "credentials are configured for one artifact" rather than "this download
      # is not the real one". Any failure stops the job before the upload.
      #
      # Only these two outer files are signed. electron-builder.yml configures no
      # Windows signing, so the app exe and the uninstaller inside them are not
      # signed. (An earlier note here said electron-builder had signed them. It
      # had not: a packaged build logs "no code signing certificate configured,
      # signing is skipped".)
      #
      # CodeSignTool is pinned (as in epona, mabon and oghma): the eSigner
      # protocol has changed between releases. It reads conf/ from its working
      # directory, so it runs in its own folder. -output_dir_path stops it from
      # asking whether to replace the input. That prompt would wait until the job
      # times out.
      #
      # CodeSignTool can print an error and still exit 0, and write no file. Thus
      # the step reads each signature back and requires the status `Valid`.
      - name: Sign installer + portable exe (SSL.com eSigner)
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          CODESIGNTOOL_VERSION: '1.3.2'
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            "${{ github.workspace }}/dist/${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}-setup.exe",
            "${{ github.workspace }}/dist/${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}-portable.exe"
          )
          $archive = "CodeSignTool-v$env:CODESIGNTOOL_VERSION-windows.zip"
          $url = "https://github.com/SSLcom/CodeSignTool/releases/download/v$env:CODESIGNTOOL_VERSION/$archive"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/$archive" -UseBasicParsing
          Expand-Archive -Path "$env:RUNNER_TEMP/$archive" -DestinationPath "$env:RUNNER_TEMP/codesigntool" -Force
          $jar = Get-ChildItem "$env:RUNNER_TEMP/codesigntool" -Recurse -Filter 'code_sign_tool-*.jar' | Select-Object -First 1
          if (-not $jar) { throw "no code_sign_tool jar in $archive" }
          $toolDir = $jar.Directory.Parent.FullName
          $java = Join-Path $env:JAVA_HOME 'bin/java.exe'
          & $java -version
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "not found: $file" }
            $out = Join-Path $env:RUNNER_TEMP 'esigner-output'
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            Push-Location $toolDir
            try {
              & $java -jar $jar.FullName sign "-username=$env:ES_USERNAME" "-password=$env:ES_PASSWORD" "-credential_id=$env:ES_CREDENTIAL_ID" "-totp_secret=$env:ES_TOTP_SECRET" "-input_file_path=$file" "-output_dir_path=$out" "-override=true"
              if ($LASTEXITCODE -ne 0) { throw "CodeSignTool exited $LASTEXITCODE for $file" }
            } finally {
              Pop-Location
            }
            $signed = Join-Path $out (Split-Path $file -Leaf)
            if (-not (Test-Path $signed)) { throw "CodeSignTool wrote no signed file for $file" }
            Move-Item -Force $signed $file
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne 'Valid') { throw "signature on $file is $($sig.Status)" }
            Write-Host "signed: $file ($($sig.SignerCertificate.Subject))"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows
          # Both, and `if-no-files-found: error` now covers both -- the setup exe
          # is named by `nsis.artifactName` in electron-builder.yml, so a rename
          # there fails this step rather than silently shipping one artifact.
          # The `.blockmap` electron-builder writes beside the installer is NOT
          # collected: it exists for electron-updater's differential download,
          # and corvath has no updater (updateCheck.ts notifies and downloads
          # nothing).
          path: |
            dist/*-setup.exe
            dist/*-portable.exe
          if-no-files-found: error
          # 1 day, not the 90-day default. These exist only to hand packages to
          # the `release` job minutes later; the published Release keeps its own
          # copy and release assets do not count against Actions storage. Three
          # 90-day releases were enough to exhaust the quota on a sibling, which
          # then failed every build job and published nothing.
          retention-days: 1

  build-mac:
    runs-on: macos-latest
    needs: validate

    steps:
      # Depth 1 (the default) is deliberate — see the CHECKOUT DEPTH note at the top.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      # Same probe-into-an-output trick as the Windows signing step above: the
      # secrets context is not usable in a step-level `if:`.
      - name: Check for signing credentials
        id: signing
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::No Developer ID certificate set — shipping an UNSIGNED dmg.'
          fi
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}

      # A universal dmg (x64 + arm64 in one). electron-builder signs when
      # CSC_LINK is present and notarizes when mac.notarize is true and the
      # APPLE_* vars are set; with neither it produces an unsigned dmg instead
      # of failing, which is what we want until the certificates exist.
      - name: Package dmg
        run: npx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # The macOS read of the same wire (HTOO-374). This job had none, so a dmg
      # whose fuses electron-builder never flipped would publish with every gate
      # green. Packaging, the optional signing and the dmg are one
      # electron-builder call here, and no later step signs the dmg, so this is
      # the earliest point to read: before the upload, so a wrong wire never
      # reaches the release. The dmg is `arch: universal`, and the reader checks
      # BOTH slices' wires; the public getCurrentFuseWire reads only the first.
      - name: Verify Electron fuses
        run: npm run verify:fuses -- dist/mac-universal/Corvath.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 1

  build-linux:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      # Depth 1 (the default) is deliberate — see the CHECKOUT DEPTH note at the top.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package AppImage + deb
        run: npx electron-builder --linux --publish never

      # Same read as the Windows job. Cheap here because the unpacked tree is
      # already on disk beside the AppImage, and it is a second architecture's
      # worth of evidence that the fuse step is running at all. Linux ignores the
      # asar integrity fuse; the reader only confirms it is set.
      - name: Verify Electron fuses
        run: npm run verify:fuses -- dist/linux-unpacked/corvath

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-mac, build-linux]
    if: github.ref_type == 'tag'

    steps:
      # Checkout (the release job otherwise only downloads artifacts) so the
      # CHANGELOG + extract script are on disk.
      # Depth 1 (the default) is deliberate — see the CHECKOUT DEPTH note at the top.
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Pull this tag's section from CHANGELOG.md into the release body. Missing
      # section → empty file → the release falls back to the auto notes below.
      - name: Extract release notes from CHANGELOG
        run: node scripts/changelog-extract.mjs "${{ github.ref_name }}" > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*-setup.exe
            artifacts/**/*-portable.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
          # Curated CHANGELOG section on top; generate_release_notes appends the
          # auto PR list + Full Changelog link below it.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Notify Discord
        if: success()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && { echo "No webhook configured; skipping."; exit 0; }
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/$REPO/releases/tag/$TAG"
          curl -sf -H "Content-Type: application/json" \
            -d "{\"content\": \"**Corvath $TAG** is now available!\n$RELEASE_URL\"}" \
            "$DISCORD_WEBHOOK_URL"
