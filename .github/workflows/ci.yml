name: CI

# Split out of release.yml, which carried the only gate this repo had. Two
# reasons it belongs in its own file: release.yml fires on a `v*` tag, so its
# PR trigger was doing unrelated work in a workflow named "Release", and a
# tag-triggered run cannot usefully cancel in-flight while a CI run can.
# MANUAL ONLY (HTOO-390). GitHub bills windows runners at 2x and macOS at 10x,
# and this workflow ran on every pull request and every push -- so a change was
# checked twice, once on the PR and again on the merge commit. One day of that
# across the house on 2026-08-12 exhausted the shared Actions allowance and the
# account hit its spending limit mid-merge.
#
# What replaces it: "npm run validate", run by hand before a push. A pre-push
# hook ran it from 2026-08-12 to 2026-10-10; it was removed because GitHub
# Desktop and Balor could not start npm from it. "npm run validate:linux" runs
# the same suite on real Linux through WSL, for the platform a Windows dev box
# cannot cover.
#
# release.yml is untouched: it still validates at tag time and still builds the
# macOS and Linux artifacts, which cannot be built on the dev box at all.
#
# WHAT IS LOST, rather than glossed: a hosted runner is a DIFFERENT machine from
# the dev box, and on oghma it twice caught what the dev box could not -- the
# runner ships core.autocrlf=true, and its file-time clock advances about every
# 15 ms where a dev box's is finer. Fire this by hand before a release or a
# platform-shaped change:
#   gh workflow run ci.yml --ref <branch>
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push cancels the in-flight run for the same branch/PR. Safe here and
  # wasteful nowhere — unlike release.yml, a cancelled check loses nothing.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # No native addon, so ubuntu is fine and finishes faster than windows.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:check

      - name: Format check
        run: npm run format:check

      - name: Test + coverage gate
        run: npm run test:coverage

      # Production dependencies only, high and above. Both narrowings are
      # load-bearing: eslint, vite and electron-builder do not ship, so an
      # advisory in one is something to schedule rather than something that
      # should red an unrelated PR. A gate that cries wolf gets deleted, and
      # then there is no gate.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    # windows-latest, not ubuntu: these specs drive a real Electron window and
    # read OS window geometry. Windows runners have a desktop session, so no
    # xvfb wrapper is needed (creidhne reached the same conclusion).
    runs-on: windows-latest
    needs: validate

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run e2e` builds first; the specs load out/main/index.js.
      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          # A debugging artifact, so it outlives the run — unlike the release
          # build artifacts, which are consumed minutes later (see release.yml).
          retention-days: 7
          if-no-files-found: ignore
